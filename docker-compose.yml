x-database-url: &database-url postgresql+psycopg://${POSTGRES_USER:-price_tracker}:${POSTGRES_PASSWORD:-changeme}@${POSTGRES_HOST:-host.docker.internal}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-price_tracker}
x-host-postgres: &host-postgres
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:

  database-migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: price-tracker-database-migrate
    command: ["python", "-m", "app.migrations", "upgrade", "head"]
    environment:
      ENV: production
      LOG_LEVEL: INFO
      DATABASE_URL: *database-url
    restart: "no"
    <<: *host-postgres
    networks:
      - price-tracker-net

  price-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: price-tracker
    depends_on:
      database-migrate:
        condition: service_completed_successfully
    environment:
      ENV: production
      LOG_LEVEL: DEBUG
      DATABASE_URL: *database-url
      PLAYWRIGHT_HEADLESS: "true"
      ENABLE_SCHEDULER: "true"
      SCAN_ON_STARTUP: ${SCAN_ON_STARTUP:-false}
      ENABLE_CATALOG_SCAN: ${ENABLE_CATALOG_SCAN:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_CONNECTIVITY_ENABLED: ${TELEGRAM_CONNECTIVITY_ENABLED:-true}
    restart: unless-stopped
    <<: *host-postgres
    healthcheck:
      test: ["CMD", "python", "-m", "app.readiness", "--service", "main"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - price-tracker-net

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: price-tracker-dashboard
    command: ["python", "-m", "app.dashboard", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      database-migrate:
        condition: service_completed_successfully
    environment:
      ENV: production
      LOG_LEVEL: INFO
      DATABASE_URL: *database-url
      AUTH_BOOTSTRAP_TOKEN: ${AUTH_BOOTSTRAP_TOKEN:-changeme-in-production}
      TELEGRAM_CONNECTIVITY_ENABLED: ${TELEGRAM_CONNECTIVITY_ENABLED:-true}
    restart: unless-stopped
    <<: *host-postgres
    healthcheck:
      test: ["CMD", "python", "-m", "app.readiness", "--service", "dashboard"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - price-tracker-net
    expose:
      - "8000"

  telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: price-tracker-telegram-bot
    command: ["python", "-m", "app.bot.main"]
    depends_on:
      database-migrate:
        condition: service_completed_successfully
    environment:
      ENV: production
      LOG_LEVEL: INFO
      DATABASE_URL: *database-url
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_REQUIRE_CHAT_ID: "false"
      TELEGRAM_CONNECTIVITY_ENABLED: ${TELEGRAM_CONNECTIVITY_ENABLED:-true}
    restart: unless-stopped
    <<: *host-postgres
    healthcheck:
      test: ["CMD", "python", "-m", "app.readiness", "--service", "telegram-bot"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - price-tracker-net

  caddy:
    image: caddy:2-alpine
    container_name: price-tracker-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - dashboard
      - telegram-bot
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - price-tracker-net

volumes:
  caddy_data:
  caddy_config:

networks:
  price-tracker-net:
    driver: bridge
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.30.0.0/24}
