version: "3.8"

services:
  price-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: price-tracker
    environment:
      - ENV=production
      - LOG_LEVEL=INFO
      - DATABASE_URL=sqlite:///./data/price_tracker.db
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - PLAYWRIGHT_HEADLESS=true
      - ENABLE_SCHEDULER=true
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - price-tracker-net

networks:
  price-tracker-net:
    driver: bridge
