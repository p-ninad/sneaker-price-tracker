services:
  postgres:
    image: postgres:16-alpine
    container_name: price-tracker-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-price_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-price_tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-price_tracker} -d ${POSTGRES_DB:-price_tracker}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - price-tracker-net

  price-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: price-tracker
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENV: production
      LOG_LEVEL: DEBUG
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-price_tracker}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-price_tracker}
      PLAYWRIGHT_HEADLESS: "true"
      ENABLE_SCHEDULER: "true"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "app.readiness", "--service", "main"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - price-tracker-net

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: price-tracker-dashboard
    command: ["python", "-m", "app.dashboard", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENV: production
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-price_tracker}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-price_tracker}
      AUTH_BOOTSTRAP_TOKEN: ${AUTH_BOOTSTRAP_TOKEN:-changeme-in-production}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "app.readiness", "--service", "dashboard"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - price-tracker-net
    expose:
      - "8000"

  telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: price-tracker-telegram-bot
    command: ["python", "-m", "app.bot.main"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENV: production
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-price_tracker}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-price_tracker}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_REQUIRE_CHAT_ID: "false"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "app.readiness", "--service", "telegram-bot"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - price-tracker-net

  caddy:
    image: caddy:2-alpine
    container_name: price-tracker-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - dashboard
      - telegram-bot
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - price-tracker-net

volumes:
  caddy_data:
  caddy_config:
  pgdata:

networks:
  price-tracker-net:
    driver: bridge
